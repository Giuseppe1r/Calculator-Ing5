server.port=${SERVER_PORT:8080}
spring.application.name=calculator

# --- Datasource -------------------------------------------------------------
# Los valores por defecto apuntan al servicio "db" de docker-compose; se pueden
# sobreescribir con variables de entorno para otros entornos de despliegue.
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:calculator}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:calculator}
spring.datasource.password=${DB_PASSWORD:calculator}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# --- JPA --------------------------------------------------------------------
# El esquema es responsabilidad de db/init.sql; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# El SQL se registra via log4jdbc, no hace falta duplicarlo con show-sql.
spring.jpa.show-sql=false

# --- Logging ----------------------------------------------------------------
# log4jdbc es muy verboso: se deja solo la sentencia y su tiempo de ejecucion.
logging.level.jdbc=WARN
logging.level.jdbc.sqlonly=${SQL_LOG_LEVEL:INFO}
logging.level.jdbc.sqltiming=WARN

# --- CORS -------------------------------------------------------------------
# En docker-compose el frontend llama al backend a traves del proxy /api de
# nginx (mismo origen), asi que CORS solo hace falta para desarrollo local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
