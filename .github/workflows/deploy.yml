name: CI

on:
  push:
    branches:
      - main

jobs:
  verificar:
    name: Verificar servidor
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verificar servidor
        run: |
          hostname
          pwd
          ls -la

      - name: Verificar Docker
        run: |
          docker version
          docker compose version

  deploy:
    name: Deploy
    needs: verificar
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack
        working-directory: simulacion-despliegue-devops-main
        run: |
          docker compose up -d --build --wait

      - name: Estado de los contenedores
        working-directory: simulacion-despliegue-devops-main
        run: docker compose ps

      - name: Logs si el despliegue falla
        if: failure()
        working-directory: simulacion-despliegue-devops-main
        run: docker compose logs --tail 100
